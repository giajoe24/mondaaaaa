<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子工学 重要問題集</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e3e6eb;--acc:#2f6fed;--ok:#1a9a5a;--ng:#d64545;--okbg:#e8f6ee;--ngbg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8eaee;--sub:#9aa1ad;--line:#2e333b;--acc:#6b9bff;--ok:#4cc38a;--ng:#ff7a7a;--okbg:#17301f;--ngbg:#3a1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin:8px 0;text-align:left}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center;font-weight:600}
.btn.ghost{text-align:center}
.cat{display:flex;justify-content:space-between;align-items:center}
.cat small{color:var(--sub)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--sub);margin-bottom:6px}
.q{font-size:16px;font-weight:600;margin:4px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0;text-align:left;font-size:15px}
.opt .mk{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--sub);margin-top:1px}
.opt.multi .mk{border-radius:5px}
.opt.sel{border-color:var(--acc)}.opt.sel .mk{background:var(--acc);border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .mk{background:var(--ok);border-color:var(--ok)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .mk{background:var(--ng);border-color:var(--ng)}
.opt:disabled{cursor:default}
.opt.dk{border-style:dashed;color:var(--sub);margin-top:14px}
.opt.dk .mk{border-style:dashed}
.res{padding:12px;border-radius:10px;margin-top:10px;font-size:14px}
.res.ok{background:var(--okbg)}.res.ng{background:var(--ngbg)}
.res b{display:block;margin-bottom:4px}
.more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px}
.more b{color:var(--acc)}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.list li{margin:6px 0;font-size:14px}
.hint{font-size:12px;color:var(--sub);margin:-6px 0 6px}
.memo td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.memo td:first-child{color:var(--sub);white-space:nowrap;padding-right:10px}
.memo table{border-collapse:collapse;width:100%}
h2{font-size:16px;margin:0 0 8px}

#bk{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:50;padding:0 0 env(safe-area-inset-bottom)}
.bkbar{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
.bkpg{padding:10px 8px;overflow-x:auto}
.bkpg img{display:block;width:100%;max-width:900px;margin:4px auto;background:#fff;border-radius:6px}
.bkpg img.zm{width:200%;max-width:none}

.fc{border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.fc .k{font-weight:600}
.fc .v{color:var(--acc);margin-top:4px;font-size:14.5px}
.fc.hid .v{color:transparent;background:var(--line);border-radius:6px;user-select:none}
.fhead{font-size:13px;color:var(--sub);margin:16px 0 2px}

.les h3{font-size:15px;margin:16px 0 6px;color:var(--acc)}
.les p,.les li{font-size:14.5px;line-height:1.75}
.les ul{padding-left:20px;margin:6px 0}
.les .tip{background:var(--okbg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// type: s=1つ選ぶ, m=すべて選ぶ, tf=○×
const Q=[
// ===== 第2章 1 半導体の性質 =====
{i:1,c:"半導体の性質",t:"s",q:"P形半導体の説明として正しいものはどれか。",o:["真性半導体に価電子3個のインジウムやホウ素を混ぜたもの","真性半導体に価電子5個のヒ素やリンを混ぜたもの","真性半導体に価電子3個のヒ素やリンを混ぜたもの","真性半導体に価電子5個のインジウムやホウ素を混ぜたもの"],a:[0],e:"P形＝アクセプタ(3価：In、B、Ga)、N形＝ドナー(5価：As、P、Sb)。元素名と価電子数の組合せのひっかけに注意。"},
{i:1,c:"半導体の性質",t:"s",q:"N形半導体の多数キャリアはどれか。",o:["電子","ホール(正孔)","イオン","陽子"],a:[0],e:"N形は電子が多数キャリアでホールが少数キャリア。P形はその逆。"},
{i:1,c:"半導体の性質",t:"s",q:"N形半導体を作るために加える不純物の名称はどれか。",o:["ドナー","アクセプタ","キャリア","ベース"],a:[0],e:"N形に入れる5価の不純物＝ドナー、P形に入れる3価の不純物＝アクセプタ。"},
{c:"半導体の性質",t:"tf",q:"「真性半導体は非常に純度の高い半導体で、I形半導体とも呼ばれる。」",o:["○","×"],a:[0],e:"Intrinsic(真性)のI。トランジスタに使われるのは不純物半導体。"},
{c:"半導体の性質",t:"s",q:"半導体の原子が隣り合う原子と電子を共有して結合している状態を何というか。",o:["共有結合","イオン結合","金属結合","PN接合"],a:[0],e:"ダイヤモンド構造をつくる共有結合。電子が飛び出した抜けがらがホール(正孔)になる。"},
{c:"半導体の性質",t:"s",q:"ホール(正孔)の移動について正しいものはどれか。",o:["電界と同じ方向に移動し、正電荷のような役割をする","電界と逆方向に移動する","移動しない","原子核そのものが移動する"],a:[0],e:"電子は電界と逆方向に、ホールは同じ方向に移動するように見える。"},
{i:1,c:"半導体の性質",t:"s",q:"半導体の主な性質・作用として誤っているものはどれか。",o:["誘電現象","整流作用","光電効果","熱電効果"],a:[0],e:"誘電現象はコンデンサの誘電体の性質。半導体には整流作用、光電効果、熱電効果、温度による抵抗変化などがある。"},
{c:"半導体の性質",t:"s",q:"PN接合のP形に(＋)、N形に(−)の電圧を加えたときの説明として正しいものはどれか。",o:["順方向電圧で、電流が流れる","逆方向電圧で、電流は流れない","順方向電圧で、電流は流れない","逆方向電圧で、電流が流れる"],a:[0],e:"P＋・N−が順方向。逆にすると、ホールと電子が電極側へ引き寄せられて電流は流れない。"},
{c:"半導体の性質",t:"s",q:"トランジスタの3つの部分のうち、中央の部分を何というか。",o:["ベース","エミッタ","コレクタ","ゲート"],a:[0],e:"中央がベース(B)。外側の順方向の領域がエミッタ(E)、逆方向の領域がコレクタ(C)。"},
// ===== 2 接合ダイオード =====
{i:1,c:"ダイオード",t:"s",q:"順方向バイアスをかけて使用するダイオードはどれか。",o:["発光ダイオード","可変容量ダイオード","定電圧ダイオード","フォトダイオード"],a:[0],e:"LEDは順方向。可変容量・定電圧(ツェナー)・フォトダイオードは逆方向電圧で使う。"},
{i:1,c:"ダイオード",t:"s",q:"ダイオードに関する記述として誤っているものはどれか。",o:["線形素子である","整流作用を持っている","逆方向抵抗は非常に大きい","順方向抵抗は非常に小さい"],a:[0],e:"電圧と電流が比例しない非線形素子。"},
{i:1,c:"ダイオード",t:"tf",q:"「シリコンダイオードは、ゲルマニウムダイオードに比べ、熱に弱く逆耐電圧が低い。」",o:["○","×"],a:[1],e:"逆。最高許容温度はGe約80℃、Si約150℃。Siは逆耐電圧も数百Vあり、セレン整流器と比べても非常に優れる。"},
{c:"ダイオード",t:"s",q:"一般の接合ダイオードで、順方向の立上り電圧が小さいのはどちらか。",o:["ゲルマニウム(Ge)","シリコン(Si)","どちらも同じ","温度で入れ替わる"],a:[0],e:"立上り電圧はGeのほうがSiより小さい。"},
{c:"ダイオード",t:"s",q:"平均電流が100〜200mA以上のダイオードは主に何と呼ばれるか。",o:["整流素子(パワーダイオード)","スイッチングダイオード","検波ダイオード","ツェナーダイオード"],a:[0],e:"大容量のものは電力整流器に、小容量のものは検波用に使う。整流作用とスイッチング作用を持つものはスイッチングダイオードとも呼ぶ。"},
{c:"ダイオード",t:"s",q:"還元性ガス中でN形シリコンにアルミニウムを合金させて作るダイオードはどれか。",o:["合金形ダイオード","点接触ダイオード","拡散形ダイオード","エサキダイオード"],a:[0],e:"Al側がP形になってPN接合ができる。Siが陰極、Alが陽極。"},
{i:1,c:"ダイオード",t:"s",q:"逆方向電圧を大きくしたとき、ある値から急に電流が増える現象を何というか。",o:["降伏(ツェナー降伏)","トンネル効果","飽和","点弧"],a:[0],e:"このときの電圧が降伏電圧。これを利用したのが定電圧(ツェナー)ダイオードで、降伏電圧は3〜1000V程度まで作れる。"},
{c:"ダイオード",t:"s",q:"定電圧ダイオードの主な用途はどれか。",o:["定電圧回路","FM変調器","超高周波の発振","表示装置"],a:[0],e:"広い電流範囲で電圧がほぼ一定になる性質を利用する。"},
{i:1,c:"ダイオード",t:"s",q:"負性抵抗(電圧を高くすると電流が減る)の性質を持つダイオードはどれか。",o:["エサキダイオード","可変容量ダイオード","定電圧ダイオード","フォトダイオード"],a:[0],e:"不純物濃度の高いN形Geと3価のInを接合したもの。トンネル効果を利用し、超高周波の発振・増幅に使う。低雑音・小形・高速。"},
{c:"ダイオード",t:"tf",q:"「エサキダイオードは、不純物が多いほど降伏電圧が小さくなる。」",o:["○","×"],a:[0],e:"不純物の量によって特性が変わる。"},
{i:1,c:"ダイオード",t:"tf",q:"「テレビの同調回路に用いる可変容量ダイオードの容量は、逆方向に加える電圧を高くするほど大きくなる。」",o:["○","×"],a:[1],e:"C＝k/√V。逆電圧を上げると空乏層が広がり、容量は小さくなる。"},
{i:1,c:"ダイオード",t:"s",q:"可変容量ダイオードに関係がないものはどれか。",o:["負性抵抗","空乏層","静電容量","逆方向電圧"],a:[0],e:"負性抵抗はエサキダイオード。可変容量ダイオードは逆電圧→空乏層→容量の変化で、FM変調器やテレビのAFC回路に使う。"},
{c:"ダイオード",t:"s",q:"可変容量ダイオードの容量Cと逆方向電圧Vの関係式はどれか。",o:["C＝k/√V","C＝kV","C＝k√V","C＝kV²"],a:[0],e:"容量は逆電圧の平方根に反比例する。"},
// ===== 3 トランジスタ =====
{c:"トランジスタ・FET",t:"s",q:"トランジスタの歴史で最初のもので、点接触ダイオードにもう1本の探針を付けたものはどれか。",o:["点接触トランジスタ","接合形トランジスタ","FET","IGBT"],a:[0],e:"増幅率αは1より大きく、数十MHzまで使用できた。"},
{c:"トランジスタ・FET",t:"s",q:"高周波特性をよくするため、拡散層を用いてベースを極めて薄くした、最も広く使われるトランジスタはどれか。",o:["拡散型トランジスタ","点接触トランジスタ","合金形トランジスタ","パワートランジスタ"],a:[0],e:"メサ形とも呼ばれる。改良形にプレーナ形・エピタキシャルプレーナ形があり、特にシリコン基板では特性が優れる。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"NPN形トランジスタのエミッタ電流を求める式として正しいものはどれか。",o:["IE＝IC＋IB","IE＝IC−IB","IE＝IC×IB","IE＝IC÷IB"],a:[0],e:"エミッタ電流＝コレクタ電流＋ベース電流。NPNでもPNPでも同じ。"},
{i:1,c:"トランジスタ・FET",t:"m",q:"エミッタ電流IEについて正しいものをすべて選べ。",o:["IE＝IC＋IB","IE≒IC","IE＝IC−IB","IE≒IB","IE＝IC×IB"],a:[0,1],e:"ICはIBの数十〜数百倍なので、実用上はIE≒ICとして扱う。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"電流増幅率β(hFE)を表す式はどれか。",o:["IC÷IB","IE÷IC","IB÷IC","IB÷IE"],a:[0],e:"β＝IC/IB(エミッタ接地)。α＝IC/IE(ベース接地)。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"IC＝5[mA]、IB＝50[μA]のとき、エミッタ電流IEはいくらか。",o:["5.05 mA","4.95 mA","5.50 mA","4.50 mA"],a:[0],e:"50μA＝0.05mA。IE＝5＋0.05＝5.05mA。μA→mAは÷1000。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"IC＝4[mA]、IB＝20[μA]のとき、電流増幅率βはいくらか。",o:["200","80","20","0.005"],a:[0],e:"β＝4mA÷0.02mA＝200。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"IE＝2[mA]、IB＝40[μA]のとき、ICはいくらか。",o:["1.96 mA","2.04 mA","1.60 mA","2.40 mA"],a:[0],e:"IC＝IE−IB＝2−0.04＝1.96mA。"},
{c:"トランジスタ・FET",t:"s",q:"βの値の一般的な範囲と、低周波用で大電流を扱うトランジスタの名称の組合せはどれか。",o:["数10〜数100・パワートランジスタ","0.95〜0.99・パワートランジスタ","数10〜数100・スイッチングトランジスタ","1以下・フォトトランジスタ"],a:[0],e:"βは数10〜数100。0.95〜0.99はαの値。"},
{i:1,c:"トランジスタ・FET",t:"tf",q:"「電界効果トランジスタ(FET)は、電流制御素子である。」",o:["○","×"],a:[1],e:"FETはゲート電圧で電流を制御する電圧制御素子。バイポーラトランジスタは電流制御素子。"},
{c:"トランジスタ・FET",t:"s",q:"接合型FETの動作原理として正しいものはどれか。",o:["ゲートのPN接合に逆方向電圧を加えて空乏層を変え、チャネルの幅を制御する","ベース電流でコレクタ電流を制御する","光でキャリアを発生させる","ゲートに順方向電流を流す"],a:[0],e:"ドレイン(D)−ソース(S)間の電流をゲート(G)電圧で制御する。J-FETとも呼ぶ。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"ゲート電圧0のときドレイン電流が最大で、ゲート電圧を大きくすると減っていく特性を何というか。",o:["デプレッション型(ノーマルON型)","エンハンスメント型","飽和型","スイッチング型"],a:[0],e:"接合型FETの特性。ゲートにはほとんど電流が流れないので、入力インピーダンスが非常に大きい。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"P形が基板で一部がN形になっているユニポーラトランジスタを何というか。",o:["Nチャネル","Pチャネル","NPN形","PNP形"],a:[0],e:"電流が流れるチャネルの形で呼ぶ。P基板→Nチャネル、N基板→Pチャネル。"},
{i:1,c:"トランジスタ・FET",t:"s",q:"MOS形FETの特徴として誤っているものはどれか。",o:["接合形FETと比較して低周波雑音特性がよい","入力インピーダンスが高い","エンハンスメント形とデプレッション形がある","静電誘導で絶縁破壊を起こしやすい"],a:[0],e:"MOSFETは接合形より低周波雑音が大きい。ゲートが酸化膜で絶縁されているため、静電気に弱い。"},
{c:"トランジスタ・FET",t:"s",q:"MOS形FETのゲートと基板の間にある絶縁物はどれか。",o:["シリコン酸化膜","空乏層","ガラス","セラミック"],a:[0],e:"Metal-Oxide-Semiconductor。このため入力インピーダンスが極めて高い。"},
{c:"トランジスタ・FET",t:"s",q:"パワーMOSについて正しいものはどれか。",o:["スイッチング速度が速く、200V以下の領域で変換効率が高い","高電圧・大電流のモータ制御専用である","動作が遅いが雑音が少ない","アナログ専用である"],a:[0],e:"スイッチング電源やDC-DCコンバータ等に用いる。"},
{c:"トランジスタ・FET",t:"s",q:"MOS FETをゲートに組み込んだバイポーラトランジスタで、電力制御に使うものはどれか。",o:["IGBT","J-FET","SBD","ECL"],a:[0],e:"IGBT＝絶縁ゲートバイポーラトランジスタ。"},
// ===== 4 IC =====
{i:1,c:"集積回路(IC)",t:"m",q:"集積回路(IC)の利点として正しいものをすべて選べ。",o:["大量生産で安価にできる","接続点や部品が少なく信頼性が高い","超小型化できる","信号処理の高速化に有利","高電圧・大出力に最も適している"],a:[0,1,2,3],e:"ICの利点：安価、高信頼性、使いやすい、超小型、高速化。高電圧・大出力はハイブリッドICの特徴。"},
{i:1,c:"集積回路(IC)",t:"tf",q:"「ICの分類は、回路方式によりデジタルICとアナログ(リニア)ICに大別できる。」",o:["○","×"],a:[0],e:"モノリシックとハイブリッドの分類とあわせて覚えておく。"},
{c:"集積回路(IC)",t:"s",q:"集積度による分類を、素子数が少ない順に並べたものはどれか。",o:["SSI→MSI→LSI→VLSI","MSI→SSI→LSI→VLSI","LSI→MSI→SSI→VLSI","SSI→LSI→MSI→VLSI"],a:[0],e:"SSI(100素子以下)→MSI(100〜1000)→LSI(1000以上)→VLSI。"},

}
const LES=[{"t": "① 半導体の基本", "cats": ["半導体の性質"], "b": "<h3>半導体ってなに？</h3>\n<p>電気を通す「導体」と通さない「絶縁体」の中間の物質。代表はシリコン(Si)とゲルマニウム(Ge)で、どちらも<b>価電子4個</b>。隣の原子と電子を出し合って結合している(共有結合)。</p>\n<p>純粋なもの＝<b>真性半導体(I形)</b>。ほとんど電気を通さないので、不純物を混ぜて使う。</p>\n<h3>P形とN形</h3>\n<ul>\n<li><b>N形</b>：5価(リンP・ヒ素As・アンチモンSb)を混ぜる。電子が1個余る → <b>電子</b>が多数キャリア。混ぜる不純物は<b>ドナー</b>(電子を与える)</li>\n<li><b>P形</b>：3価(インジウムIn・ホウ素B・ガリウムGa)を混ぜる。電子が1個足りず穴ができる → <b>ホール(正孔)</b>が多数キャリア。不純物は<b>アクセプタ</b>(受け取る)</li>\n</ul>\n<p>ホールは「電子の抜けた穴」。電子が隣の穴に移ると、穴が逆向きに動いて見える。電界と同じ向きに動き、＋の電荷のように振る舞う。</p>\n<h3>PN接合</h3>\n<ul><li>P側に＋、N側に−＝<b>順方向</b> → 電流が流れる</li>\n<li>逆にすると<b>逆方向</b> → キャリアが電極側へ引かれ、接合面に<b>空乏層</b>ができて流れない</li></ul>\n<h3>半導体の性質</h3>\n<p>整流作用・光電効果・熱電効果・温度で抵抗が変わる。「誘電現象」はコンデンサの話なので×。</p>\n<div class=\"tip\">ひっかけ：「P形＝5価のヒ素」のように価電子と元素名を入れ替えた選択肢が出る。<br>覚え方：<b>P＝Positive(ホール)、N＝Negative(電子)</b></div>"}, {"t": "② ダイオード", "cats": ["ダイオード"], "b": "<h3>基本</h3>\n<p>PN接合1個の素子。順方向には流れ、逆方向には流れない(整流作用)。電圧と電流が比例しないので<b>非線形素子</b>。</p>\n<ul><li>Si：熱に強い(約150℃)、立上り約0.6〜0.7V</li><li>Ge：熱に弱い(約80℃)、立上りが小さい</li></ul>\n<h3>種類と使う向き(超重要)</h3>\n<ul>\n<li><b>発光ダイオード(LED)</b>：<b>順方向</b>で光る。唯一の順方向組</li>\n<li><b>定電圧(ツェナー)ダイオード</b>：逆方向。<b>降伏</b>(ある電圧で急に流れる)を利用して電圧を一定に</li>\n<li><b>可変容量ダイオード</b>：逆方向。逆電圧↑→空乏層が広がる→<b>容量↓</b>。C＝k/√V。FM変調・AFC・テレビの同調</li>\n<li><b>フォトダイオード</b>：逆方向。光→電気信号</li>\n<li><b>エサキ(トンネル)ダイオード</b>：<b>負性抵抗</b>(電圧↑で電流↓)。超高周波の発振・増幅。江崎玲於奈がノーベル賞</li>\n</ul>\n<h3>空乏層＝コンデンサ</h3>\n<p>空乏層は電気が通らない「すき間」なので、コンデンサの絶縁体と同じ働きをする。すき間が広い＝容量が小さい。抵抗として働くわけではない(テストで×問題が出た)。</p>\n<div class=\"tip\">可変容量ダイオードの問題で「負性抵抗」が出たら、それはエサキの話なので関係ない側。</div>"}, {"t": "③ トランジスタとFET", "cats": ["トランジスタ・FET"], "b": "<h3>トランジスタの作り</h3>\n<p>NPN形とPNP形。真ん中の薄い部分が<b>ベース(B)</b>、電子を出す側が<b>エミッタ(E)</b>、集める側が<b>コレクタ(C)</b>。</p>\n<p>使うときは<b>B−E間は順方向、B−C間は逆方向</b>。NPNならエミッタからベースに電子が注入され、ほとんどがコレクタへ抜ける。</p>\n<h3>電流の式(計算で出る)</h3>\n<ul>\n<li><b>IE＝IC＋IB</b>(エミッタ＝コレクタ＋ベース)。IBはとても小さいのでIE≒IC</li>\n<li><b>β(hFE)＝IC÷IB</b>：数十〜数百</li>\n<li><b>α(hFB)＝IC÷IE</b>：0.95〜0.99(必ず1未満)</li>\n<li>β＝α/(1−α)、α＝β/(1＋β)</li>\n</ul>\n<p>例：IC＝5mA、IB＝50μA → 50μA＝0.05mAに直して、IE＝5.05mA。<b>μA→mAは÷1000</b>を忘れない。</p>\n<h3>FET(電界効果トランジスタ)</h3>\n<ul>\n<li>ゲート(G)・ドレイン(D)・ソース(S)。<b>電圧制御素子</b>(バイポーラは電流制御)</li>\n<li>ゲートにほぼ電流が流れない → <b>入力インピーダンスが非常に大きい</b></li>\n<li>接合形(J-FET)：ゲートのPN接合に逆電圧→空乏層でチャネル(通り道)を細くする。ゲート電圧0で最大電流＝<b>デプレッション型</b></li>\n<li>P基板にN形のチャネル＝<b>Nチャネル</b></li>\n<li>MOSFET：ゲートが<b>酸化膜</b>で絶縁。入力インピーダンスさらに大。<b>静電気に弱い</b>、低周波雑音は接合形より悪い</li>\n<li><b>IGBT</b>：MOSFET(入力)＋バイポーラ(出力)のいいとこ取り。電力制御用</li>\n</ul>"}, {"t": "④ 集積回路(IC)", "cats": ["集積回路(IC)"], "b": "<h3>ICの利点5つ</h3>\n<p>①安価 ②接続点・部品が<b>少なく</b>信頼性が高い ③使いやすい ④超小型 ⑤高速化に有利。<br>(テストでは「多くなるため」と入れ替えた×が出た)</p>\n<h3>分類</h3>\n<ul>\n<li>扱う信号：デジタルIC／アナログ(リニア)IC</li>\n<li>集積度：SSI＜MSI＜LSI＜VLSI</li>\n<li>構造：<b>モノリシック</b>(1枚のシリコンに全部作り込む・主流)／<b>ハイブリッド</b>(部品を組み合わせる。高電圧・大出力OK、集積度と信頼性は低い。厚膜＝印刷、薄膜＝蒸着)</li>\n</ul>\n<h3>デジタルICの種類</h3>\n<ul>\n<li><b>TTL</b>：バイポーラ、電流駆動。入力がマルチエミッタ。SBDを付けたのがショットキーTTL(高速化)</li>\n<li><b>ECL</b>：<b>最も高速</b>だが<b>消費電力最大</b>(約30mW/ゲート)。飽和させない不飽和形</li>\n<li><b>I²L</b>：バイポーラなのに省電力・高集積</li>\n<li><b>MOS</b>：電圧駆動。長所＝集積密度高・消費電力少・製造簡単・安価。短所＝速度中位・出力電流少・アナログ不向き</li>\n<li>Nチャネルは電子(移動度がホールの約2倍)なのでPチャネルより速い</li>\n<li><b>CMOS</b>：PとNを組合せ、片方が必ずOFF → <b>消費電力が非常に少ない</b>。電源電圧の自由度大・高速・TTLと整合よい。短所は<b>静電気に弱い</b>・製造が複雑</li>\n</ul>"}, {"t": "⑤ 特殊半導体素子", "cats": ["特殊半導体素子"], "b": "<h3>名前が似ているので整理</h3>\n<ul>\n<li><b>サーミスタ</b>(サーマル＝熱)：<b>温度</b>で抵抗が変わる。普通は温度↑で抵抗↓(負の温度係数)。温度計・温度補償</li>\n<li><b>バリスタ</b>(バリアブル・レジスタ)：<b>電圧</b>で抵抗が変わる。バイアス安定・サージ対策</li>\n<li><b>サイリスタ</b>(SCR)：<b>PNPN</b>の4層。ゲート電流で導通(<b>点弧</b>)し、その後ゲートを0にしても流れ続ける。止めるにはアノード電流0か逆電圧</li>\n<li><b>トライアック</b>：サイリスタ2個を逆並列 → 両方向OK。調光器など</li>\n</ul>\n<h3>光の素子</h3>\n<ul>\n<li><b>フォトダイオード</b>：逆電圧で使う。光→電気信号</li>\n<li><b>フォトトランジスタ</b>：光電流を増幅。感度大、速度は遅め</li>\n<li><b>太陽電池</b>：外から電圧をかけない。光エネルギー→電気エネルギー。無人灯台の電源</li>\n<li><b>LED</b>：材料はGaP・GaAsP・GaAs。電気→光(テストで「光→電気の素子として誤っているもの」の答えになった)</li>\n<li><b>フォトカプラ</b>：LED＋受光素子を1つに。①開閉が速い ②機械的な消耗がない ③入出力の絶縁が高い。無接点リレー</li>\n</ul>"}, {"t": "⑥ 抵抗・コンデンサ・コイル・部品", "cats": ["抵抗器", "コンデンサ", "コイル・スイッチ・リレー", "その他の部品"], "b": "<h3>抵抗器の働き(入れ替えひっかけ頻出)</h3>\n<p>①電流の路を作る・電流値を規制 ②分圧 ③<b>電流</b>の変化を<b>電圧</b>の変化として検出 ④<b>コンデンサ</b>の放電路。<br>×の例：「電圧の変化を電流として」「コイルの放流用」</p>\n<h3>抵抗の種類</h3>\n<ul>\n<li>炭素被膜(カーボン)：安い・高周波OK・電流容量小・熱と傷に弱い</li>\n<li>巻線：電流容量大・丈夫・<b>インダクタンスがあるので高周波×</b></li>\n<li>金属被膜：精度よい・高周波OK・熱に強い・高い</li>\n<li>集合抵抗：複数を1パッケージ(厚膜サーメット)</li>\n<li>チップ抵抗：1005や3216など<b>寸法</b>で呼ぶ</li>\n</ul>\n<h3>コンデンサの種類</h3>\n<ul>\n<li>電解：数μF〜数百μF・極性あり・耐圧低・低周波用。タンタルは逆付けで短絡破壊</li>\n<li>セラミック：誘電率高・小型・<b>高周波で最も広く使用</b>・ひずみやすい</li>\n<li>マイカ(雲母)：温度に非常に安定・損失少・形が大きい</li>\n<li>ポリエステル(<b>マイラ</b>)：高電圧・高温向け</li>\n<li>ポリスチロール：損失小・絶縁抵抗高・<b>70℃まで</b></li>\n<li>電気二重層：ファラッド級・バックアップ電源・短絡に強い</li>\n</ul>\n<p>コンデンサは直流を通さず、周波数が高いほど通しやすい(結合・バイパス・平滑)。</p>\n<h3>コイル</h3>\n<p>周波数が高いほど通しにくい。<b>電流</b>で磁力・磁界を作る(「電圧で」は×)。誘導起電力(トランス・マイク)、遅延、Cと組んで共振。</p>\n<h3>スイッチ・リレー・その他</h3>\n<ul><li>マイクロスイッチ：小さい力で確実・速い／ロータリー：回路数が多い</li>\n<li>リレー：信号や条件で自動的に開閉。水銀リレー・リードスイッチ・メータリレー</li>\n<li>LCD：自分で光らない(受光形)・低消費電力・分子を90°ねじる(TN)</li>\n<li>水晶振動子：圧電気現象。プリント基板：ガラスエポキシ＝GE、紙フェノール＝PP</li></ul>"}, {"t": "⑦ 増幅回路", "cats": ["増幅回路"], "b": "<h3>3つの接地方式</h3>\n<ul>\n<li><b>エミッタ接地</b>：一番よく使う。電流・電圧・電力利得すべて大。<b>位相が反転</b>。高周波は苦手。β＝IC/IB</li>\n<li><b>ベース接地</b>：<b>高周波特性が最良</b>。電流利得なし(α＜1)だが電圧利得あり。入力Z低・出力Z高</li>\n<li><b>コレクタ接地</b>(エミッタフォロワ)：電圧利得1以下。入力Z高・出力Z低 → インピーダンス変換・バッファ</li>\n</ul>\n<p>しゃ断周波数：αが低周波時の0.707倍に落ちる周波数。高いほど高周波に強い。</p>\n<h3>バイアスとA・B・C級</h3>\n<p>Siトランジスタは約0.6〜0.7Vを超えないと流れない。前もってかけておく直流電圧＝バイアス(下駄)。</p>\n<ul>\n<li><b>A級</b>：0.6Vより十分上で待機。全部増幅・ひずみ少・<b>効率最悪</b>(無信号でも電流が流れる)</li>\n<li><b>B級</b>：0.6Vぴったりで待機。半分だけ増幅。2個で分担＝<b>プッシュプル(最大効率約78%)</b>。つなぎ目に<b>クロスオーバひずみ</b> → 少しバイアスを足す＝<b>AB級</b></li>\n<li><b>C級</b>：バイアス0か逆。てっぺんだけ出る。効率最良。同調回路の惰性(フライホイール効果)で正弦波に戻す。高周波・周波数逓倍</li>\n</ul>\n<h3>バイアス回路の安定度</h3>\n<p>固定バイアス(簡単・不安定) ＜ 自己バイアス(RL経由) ＜ <b>電流帰還バイアス(最も安定・REがポイント)</b>。温度が10℃上がるとICBOは約2倍 → 安定化が必要。</p>\n<h3>その他</h3>\n<ul><li>CR結合：安価・小型・直流は増幅不可・電源利用率悪い</li>\n<li>選択度 <b>Q＝f0/B</b>(Bは3dB落ちた幅)。Qが大きいほど鋭く選べる</li>\n<li>直流増幅の出力変動＝<b>ドリフト</b>(差動増幅で対策)。インピーダンスを合わせる＝<b>整合</b></li></ul>"}, {"t": "⑧ オペアンプと発振", "cats": ["オペアンプ・発振回路"], "b": "<h3>オペアンプ</h3>\n<p>理想：増幅率∞・入力インピーダンス∞・出力インピーダンス0。負帰還をかけると＋と−の端子の電位差が0＝<b>仮想短絡</b>。</p>\n<ul>\n<li><b>反転増幅</b>：A＝<b>−R2/R1</b>(−は位相が逆)</li>\n<li><b>非反転増幅</b>：A＝<b>1＋R2/R1</b>(同相)</li>\n</ul>\n<p>例：5倍にしたい → 反転ならR1＝1・R2＝5、非反転ならR1＝1・R2＝4。</p>\n<h3>発振の条件</h3>\n<p>出力を入力と<b>同位相で戻す(正帰還)</b>、全体の利得 <b>μβ≧1</b>。</p>\n<h3>発振回路の3種類</h3>\n<ul>\n<li><b>LC発振</b>：f0＝1/(2π√LC)。数百Hz〜数百MHz。ハートレー(コイルを2つに分ける)／コルピッツ(コンデンサを2つに分ける)</li>\n<li><b>CR発振</b>：コイルなし・<b>1MHz以下</b>の低周波。ブリッジ形は測定用</li>\n<li><b>水晶発振</b>：電源・負荷・温度が変わっても<b>最も安定</b>。数MHz以上。時計やクロック</li>\n</ul>\n<div class=\"tip\">覚え方：ハートレー＝<b>H</b>enry(コイルの単位)、コルピッツ＝<b>C</b>(コンデンサ)</div>"}, {"t": "⑨ 変調と復調", "cats": ["変調・復調"], "b": "<h3>言葉</h3>\n<ul><li><b>搬送波</b>：情報を乗せる前の高周波(空のトラック)</li>\n<li><b>信号波</b>：送りたい情報(荷物)</li>\n<li><b>被変調波</b>：乗せた後の波(荷物を積んだトラック)</li>\n<li>乗せる＝<b>変調</b>、取り出す＝<b>復調(検波)</b></li></ul>\n<h3>AM(振幅変調)</h3>\n<p>波の<b>高さ</b>を変える。中波ラジオ。帯域幅は信号の<b>2倍</b>(上側波帯＋下側波帯)。</p>\n<ul><li>直線変調：ひずみ少／2乗変調：湾曲部を使うのでひずみ大</li>\n<li><b>SSB</b>：片方の側波帯だけ。帯域半分・電力少・装置が複雑・短波で使用</li>\n<li>復調：直線検波(包絡線検波)</li></ul>\n<h3>FM(周波数変調)</h3>\n<p>波の<b>詰まり具合(周波数)</b>を変える。振幅一定なので<b>振幅制限器で雑音を除ける</b>。帯域が広いのでVHF以上。</p>\n<ul><li>変調指数 <b>mf＝Δf/fs</b>、帯域幅≒<b>2(Δf＋fs)</b></li>\n<li>直接FM(可変容量ダイオード・簡単・不安定)／間接FM(水晶・安定)</li>\n<li>復調：周波数弁別回路(フォスタシーレー＝リミッタ必要／レシオディテクタ＝リミッタ簡略化)</li></ul>\n<div class=\"tip\">AM＝振幅、FM＝周波数、PM＝位相。「FMは位相を変える」は×。</div>"}, {"t": "⑩ 電源とパルス", "cats": ["電源回路", "パルス回路"], "b": "<h3>電源回路</h3>\n<p>順番：<b>変圧(トランス) → 整流(ダイオード) → 平滑(コンデンサ等)</b>。必要な特性は①滑らかな直流 ②負荷が変わっても電圧が変わりにくい ③効率がよい。</p>\n<ul>\n<li>リップル率＝交流分÷直流分×100。小さいほど良い</li>\n<li>電圧変動率＝(無負荷−全負荷)÷<b>全負荷</b>×100。例：220V→200Vなら20÷200＝10%</li>\n<li>整流効率＝直流出力÷交流入力×100</li>\n</ul>\n<ul>\n<li><b>半波整流</b>：平均Vm/π、リップル約121%、効率約40%</li>\n<li><b>全波整流</b>(中間タップ・2本)：平均2Vm/π、48%・80%</li>\n<li><b>ブリッジ</b>(4本)：中間タップ不要・1本あたりの耐圧が小さくてよい</li>\n<li>倍電圧：約2Vm・小電流向け</li>\n<li>コンデンサ入力形：負荷で電圧変動大・小容量向け／チョーク入力形：半波には使えない</li>\n<li>三端子レギュレータ(IC化)／スイッチング電源：小型・高効率だがノイズ多</li>\n</ul>\n<h3>パルス回路</h3>\n<ul>\n<li>パルス幅＝50%の間。立上り＝10→90%。周波数＝1÷周期</li>\n<li><b>微分回路</b>(Cが直列)：変化の部分を取り出す→トリガ／<b>積分回路</b>(Rが直列)：なまらせる</li>\n<li>時定数＝<b>C×R</b>。kΩ×μF＝ms(例：200kΩ×10μF＝2s)</li>\n<li>リミッタ：高さをそろえる</li>\n<li>マルチバイブレータ：<b>無安定</b>＝自分で発振／<b>単安定</b>＝トリガで1発(τ＝0.7CR)／<b>双安定</b>＝記憶(フリップフロップ)</li>\n</ul>"}, {"t": "⑪ ディジタル回路", "cats": ["ディジタル回路"], "b": "<h3>基本の論理回路</h3>\n<ul>\n<li><b>AND</b>：全部1のときだけ1(直列のスイッチ)</li>\n<li><b>OR</b>：どれか1つでも1なら1(並列のスイッチ)</li>\n<li><b>NOT</b>：反転</li>\n<li><b>NAND／NOR</b>：AND／ORの出力を反転(記号に○が付く)</li>\n<li><b>ExOR</b>：AとBが<b>違う</b>ときだけ1／<b>ExNOR</b>：同じとき1(一致回路)</li>\n</ul>\n<p>表し方：<b>ブール代数</b>(0と1を変数として計算)、<b>真理値表</b>(入出力を表にしたもの)。</p>\n<p><b>ド・モルガン</b>：¬(A＋B)＝Ā・B̄、¬(A・B)＝Ā＋B̄。「棒を切ったら＋と・を入れ替え」。入力を両方反転してNORに入れるとAND。</p>\n<h3>組合せ回路と順序回路</h3>\n<ul><li>組合せ回路(記憶しない)：エンコーダ・デコーダ・セレクタ・比較器・加算器</li>\n<li>半加算：和S＝ExOR、桁上げC＝AND</li>\n<li>順序回路(記憶する)：フリップフロップ・カウンタ・シフトレジスタ</li></ul>\n<h3>フリップフロップ</h3>\n<ul>\n<li>RS：NOR形はS＝R＝1が禁止、NAND形はS＝R＝0が禁止</li>\n<li>D：クロックでDを取り込む(一番よく使う)</li>\n<li>JK：J＝K＝1でトグル(反転)</li>\n<li>T：T＝1でトグル → 周波数が1/2(2分周)</li>\n</ul>\n<p>カウンタ：FF3段で8進。<b>5(101)でクリア → 5進</b>。「クリアする数＝何進」。</p>"}, {"t": "⑫ デシベル", "cats": ["デシベル"], "b": "<h3>式は2つだけ</h3>\n<ul><li>電圧・電流：<b>20log</b>(倍率)</li><li>電力：<b>10log</b>(倍率)</li></ul>\n<h3>覚える数</h3>\n<ul>\n<li>log2＝0.301、log3＝0.477(問題に書いてある)</li>\n<li>電圧：10倍＝20dB、100倍＝40dB、1000倍＝60dB、10000倍＝80dB(<b>0の数×20</b>)</li>\n<li>電力：10倍＝10dB、1000倍＝30dB(<b>0の数×10</b>)</li>\n<li>電圧2倍≒6dB、電力2倍≒3dB</li>\n</ul>\n<h3>logの計算ルール</h3>\n<ul><li>log(A×B)＝logA＋logB → log6＝0.301＋0.477＝0.778</li>\n<li>log(A÷B)＝logA−logB → log5＝1−0.301＝0.699</li>\n<li>log(Aⁿ)＝n×logA → log8＝3×0.301＝0.903</li></ul>\n<p>増幅器をつなぐと、倍率はかけ算、<b>dBは足し算</b>(6dB＋6dB＝12dB)。</p>\n<p>例：入力5mV→出力0.5V → 0.5÷0.005＝100倍 → 40dB(単位をそろえる！)</p>\n<h3>基準つきのdB</h3>\n<ul><li>dBm：1mWが0dB(1W＝30dBm)。600Ωで0dBm＝0.775V</li>\n<li>dBμ：1μVが0dB</li><li>音圧：20μPaが0dB。dBが変わると音の<b>大きさ</b>が変わる(高さではない)</li>\n<li>SN比＝20log(信号/雑音)</li></ul>"}, {"t": "⑬ 製図と部品の表示", "cats": ["製図", "部品の表示法"], "b": "<h3>図面の種類</h3>\n<ul><li>電気回路系統：<b>系統図(ブロックダイヤグラム)</b>・接続図(回路図)・配線図・束線図</li>\n<li>機構系統：<b>組立図</b>・部品図(第三角法)</li></ul>\n<h3>接続図のルール</h3>\n<p>信号は左→右・上→下。補助回路は外側、<b>電源回路は最下段</b>。対称な回路は接地をはさんで対称に。単位(Ω・F)は省くこともある。</p>\n<p>配線：信号線は短く、誘導を避け、長いものは束線に。<b>色別配線は5色・9色</b>。</p>\n<h3>図記号</h3>\n<p>規格はJIS C 0617(旧C 0301)。ダイオードは三角側がアノード、縦線側がカソード。長方形に斜め矢印＝可変抵抗。円の中の文字：V電圧計、A電流計、Hz周波数計、cosφ力率計。</p>\n<h3>カラーコード</h3>\n<p>黒0 茶1 赤2 橙3 黄4 緑5 青6 紫7 灰8 白9。1・2本目が数字、3本目が0の数、4本目が許容差(<b>金±5%、銀±10%、なし±20%</b>)。</p>\n<p>例：黄紫赤金＝47×100＝4.7kΩ±5%。有効数字は2ケタか3ケタ(4ケタは×)。</p>\n<h3>数字表示</h3>\n<ul><li>3ケタ：上2つが数字、3つ目が0の数。コンデンサはpF：<b>104＝0.1μF</b>、224＝0.22μF。抵抗：472＝4.7kΩ</li>\n<li>Rは小数点(3R3＝3.3)。J±5%、K±10%、M±20%</li>\n<li>2SA・2SB＝PNP、2SC・2SD＝NPN、A・C高周波、B・D低周波、2SJ/2SK＝FET(P/N)</li></ul>"}, {"t": "⑭ 第7章 通信と電子機器", "cats": ["テスト第7章"], "b": "<h3>デジタル化(PCM)</h3>\n<p><b>標本化 → 量子化 → 符号化</b>。標本化は最高周波数の<b>2倍以上</b>(標本化定理)。電話：8kHz(125μs)・8ビット。CD：44.1kHz・16ビット。可逆圧縮(zip)／非可逆圧縮(JPEG・MP3・MPEG)。</p>\n<h3>変調</h3>\n<p>アナログ AM/FM/PM ⇔ デジタル <b>ASK/FSK/PSK</b>(振幅/周波数/位相)。BPSK(2相)1ビット、QPSK(4相)2ビット、8PSK3ビット。</p>\n<h3>ネットワーク</h3>\n<p>LAN・MAN・WAN。ISP(プロバイダ)、IX(相互接続点)。OSI7層：上から「アプセトネデブ」。<b>IP＝3層、TCP＝4層</b>。TCPのデータ＝セグメント→IPを付けてパケット→フレーム。TTL8ビット＝最大255台。</p>\n<h3>電波</h3>\n<p>周波数×波長＝速さ(3×10⁸m/s)。<b>λ[m]＝300÷f[MHz]</b>。</p>\n<ul><li>MF＝AM放送、HF＝短波(電離層で遠くへ)、VHF＝FM放送(76〜90MHz)、UHF＝地デジ・携帯・GPS、SHF＝衛星放送・ETC</li>\n<li>アンテナ：八木・宇田＝テレビ、パラボラ＝衛星</li>\n<li>AMラジオ531〜1602kHz・9kHz間隔。AMはDSB、片方だけがSSB</li></ul>\n<h3>携帯・放送・電話</h3>\n<ul><li>FDMA(周波数)・TDMA(時間)・CDMA(拡散符号)。4G・LTE＝OFDMA</li>\n<li>地デジ＝UHF・OFDM・13セグメント(真ん中1つ＝ワンセグ)。BS＝東経110度・上り14GHz/下り12GHz。デジタル放送順はCS→BS→地上</li>\n<li>プッシュホン：7つの周波数の組合せ。光通信：送信はレーザ、受信はフォトダイオード。TDM・WDM(波長で多重)</li></ul>\n<h3>計測・電源・ITS</h3>\n<ul><li>オシロ：縦電圧・横時間(のこぎり波で掃引)。サンプルレート。周波数分解能はスペアナの用語</li>\n<li>DMM、ユニバーサルカウンタ。直流安定化電源＝シリーズ方式とスイッチング方式</li>\n<li>ETC＝DSRC(5.8GHz)。GPSは衛星<b>4個</b>、<b>時間差</b>で距離を出す(強度差は×)</li></ul>"}];

const LKW=[["半導体", "キャリア", "エミッタ\",\"コレクタ", "ベースを中心"], ["ダイオード", "空乏層"], ["FET", "トランジスタの電流値", "トランジスタにおいて"], ["集積回路", "CMOS", "MOS集積", "MOS型FET"], ["サーミスタ", "サイリスタ", "バリアブル", "フォトカプラ", "光を電気", "GaP", "光電素子", "太陽電池", "発光ダイオード"], ["抵抗", "コンデンサ", "コイル", "スイッチ", "リレー", "液晶", "LCD", "プリント配線", "センサ"], ["接地", "増幅回路の説明", "バイアス", "hFB", "hFE", "ベース電流IB", "トランジスタの性質", "4端子", "トランジスタ電流", "プッシュプル", "IC＝αIB"], ["オペアンプ", "演算増幅", "発振"], ["変調", "AM", "FM", "SSB"], ["整流", "平滑", "電源", "微分", "積分", "時定数", "マルチバイブレータ"], ["論理", "ブール", "真理値", "AND", "NAND", "フリップフロップ", "FF", "カウンタ"], ["dB", "デシベル", "増幅度", "マイクロホン", "音圧"], null, null];
function inLes(q,i){const l=LES[i];if(l.cats.includes(q.c))return true;
  if(i===12&&(q.c==="テスト第4章"||q.c==="テスト第5章"))return true;
  if((q.c==="テスト第2章"&&i<=5)||(q.c==="テスト第3章"&&i>=6&&i<=11)){const s=q.q;const lo=q.c==="テスト第2章"?0:6;
    let f=-1;for(let j=lo;j<=(lo?11:5);j++){if(LKW[j]&&LKW[j].some(k=>s.includes(k))){f=j;break;}}
    if(f<0)f=lo?9:5;return f===i;}
  return false;}
function lessons(){
  let h=`<div class="top"><button class="btn" style="width:auto;padding:6px 12px;margin:0" onclick="home()">‹ もどる</button></div>
  <div class="card"><h2>📘 単元ごとの解説</h2><div class="sub">読み終わったら、下のボタンでその単元の問題を解けます。</div>`;
  LES.forEach((l,i)=>{const n=Q.filter(q=>inLes(q,i)).length;
    h+=`<button class="btn cat" onclick="lesson(${i})"><span>${l.t}</span><small>${n}問 ›</small></button>`});
  app.innerHTML=h+`</div>`;window.scrollTo(0,0);
}
function lesson(i){
  const l=LES[i];const ids=Q.map((q,k)=>inLes(q,i)?k:-1).filter(k=>k>=0);const imp=ids.filter(k=>Q[k].i||(Q[k].c.startsWith("テスト")&&Q[k].c!=="テスト第7章"));
  let h=`<div class="top"><button class="btn" style="width:auto;padding:6px 12px;margin:0" onclick="lessons()">‹ 単元一覧</button><span>${i+1} / ${LES.length}</span></div>
  <div class="card les"><h2>${l.t}</h2>${l.b}</div>
  ${imp.length?`<button class="btn primary" style="background:#e8590c;border-color:#e8590c" onclick='start(${JSON.stringify(imp)},0,${i})'>★ この単元の重要問題を解く (${imp.length}問) ›</button>`:""}
  <button class="btn ${imp.length?"ghost":"primary"}" onclick='start(${JSON.stringify(ids)},0,${i})'>この単元を全部解く (${ids.length}問)</button>
  ${i+1<LES.length?`<button class="btn ghost" onclick="lesson(${i+1})">次の単元：${LES[i+1].t} ›</button>`:""}`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function home(){
  S=null;
  let h=`<h1>電子工学 重要問題集</h1><div class="sub">全${Q.length}問・テキスト全範囲(第2〜5章)</div>
  <div class="card"><button class="btn primary" style="background:#1a9a5a;border-color:#1a9a5a" onclick="first()">🔰 まず覚えるところ</button><button class="btn primary" style="background:#534AB7;border-color:#534AB7" onclick="lessons()">📘 単元ごとの解説を読む</button><button class="btn primary" onclick="start(Q.map((_,i)=>i))">全問ランダムで解く</button>
  <button class="btn primary" style="background:#e8590c;border-color:#e8590c" onclick="start(Q.map((q,i)=>q.i?i:-1).filter(i=>i>=0))">★ 重要問題のみ (${Q.filter(q=>q.i).length}問)</button>
  <button class="btn ghost" onclick="start(Q.map((_,i)=>i),10)">ランダム10問だけ</button>
  ${wrongSet.size?`<button class="btn ghost" onclick="start([...wrongSet])">間違えた問題を復習 (${wrongSet.size}問)</button>`:""}</div>
  <div class="card" style="border-color:#2f6fed"><h2>📝 実力把握テスト形式(動画から再現)</h2><div class="sub" style="margin:-4px 0 6px">本番と同じ聞き方の問題。まずはここから！</div>
  <button class="btn primary" onclick='start(${JSON.stringify(Q.map((q,i)=>q.c.startsWith("テスト")?i:-1).filter(i=>i>=0))})'>テスト形式を全部 (${Q.filter(q=>q.c.startsWith("テスト")).length}問)</button>`;
  tcats.forEach(c=>{const ids=Q.map((q,i)=>q.c===c?i:-1).filter(i=>i>=0);
    h+=`<button class="btn cat" onclick='start(${JSON.stringify(ids)})'><span>${c.replace("テスト","")}</span><small>${ids.length}問 ›</small></button>`});
  h+=`</div><div class="card"><h2>分野別(テキスト全範囲)</h2>`;
  cats.forEach(c=>{const ids=Q.map((q,i)=>q.c===c?i:-1).filter(i=>i>=0);
    h+=`<button class="btn cat" onclick='start(${JSON.stringify(ids)})'><span>${c}</span><small>${ids.length}問 ›</small></button>`});
  h+=`</div><div class="card"><button class="btn ghost" onclick="memo()">暗記ポイントまとめを見る</button><button class="btn ghost" onclick="book(ALLPG)">📖 教科書をはじめから読む</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(ids,n,les){
  let order=shuffle(ids);if(n)order=order.slice(0,n);
  S={order,i:0,score:0,sel:[],done:false,miss:[],les:(les===undefined?-1:les)};render();
}
function render(){
  const q=Q[S.order[S.i]];
  const multi=q.t==="m";
  if(!S.optOrder||S.optFor!==S.i){S.optOrder=q.t==="tf"?[0,1]:shuffle(q.o.map((_,k)=>k));S.optFor=S.i;}
  let h=`<div class="top"><button class="btn" style="width:auto;padding:6px 12px;margin:0" onclick="home()">‹ もどる</button><span>${S.i+1} / ${S.order.length}　正解 ${S.score}</span></div>
  <div class="bar"><i style="width:${(S.i)/S.order.length*100}%"></i></div>
  <div class="card"><span class="tag">${q.i?"★重要・":""}${q.c}${multi?"・すべて選ぶ":q.t==="tf"?"・○×":""}</span><div class="q">${esc(q.q)}</div>`;
  if(multi&&!S.done)h+=`<div class="hint">当てはまるものをすべて選んで「答え合わせ」</div>`;
  S.optOrder.forEach(k=>{
    let cls="opt"+(multi?" multi":"");
    if(S.done){if(q.a.includes(k))cls+=" ok";else if(S.sel.includes(k))cls+=" ng";}
    else if(S.sel.includes(k))cls+=" sel";
    h+=`<button class="${cls}" ${S.done?"disabled":""} onclick="pick(${k})"><span class="mk"></span><span>${esc(q.o[k])}</span></button>`;
  });
  if(multi&&!S.done)h+=`<button class="btn primary" onclick="check()" ${S.sel.length?"":"disabled style='opacity:.5'"}>答え合わせ</button>`;
  if(!S.done)h+=`<button class="opt dk" onclick="dunno()"><span class="mk"></span><span>わからない</span></button>`;
  if(S.done){const ok=S.last;
    h+=`<div class="res ${ok?"ok":"ng"}" id="resbox"><b>${ok?"正解！":S.dk?"わからない → 答えはこれ":"不正解"}</b>${esc(q.e)}</div>
    <button class="btn primary" onclick="next()">${S.i+1<S.order.length?"次の問題 ›":"結果を見る"}</button>
    <button class="btn ghost" onclick="askClaude(this)">🤖 Claudeに聞く(問題と答えをコピー)</button>
    <textarea id="asktxt" readonly style="display:none;width:100%;height:140px;font-size:13px;border-radius:8px;border:1px solid var(--line);padding:8px;background:var(--card);color:var(--ink)"></textarea>
    ${q.x?`<div class="res" style="background:transparent;border:1px dashed var(--line)"><b style="color:var(--acc)">📚 周辺知識</b>${esc(q.x)}</div>`:""}
    ${q.p.length?`<button class="btn ghost" onclick='book(${JSON.stringify(q.p)})'>📖 教科書を見る (P.${q.p.join("・P.")})</button>`:`<div class="sub" style="margin:8px 0">📖 このページの教科書は未収録です</div>`}`;}
  h+=`</div>`;app.innerHTML=h;if(S.scr){S.scr=0;const r=document.getElementById("resbox");if(r)r.scrollIntoView({behavior:"smooth",block:"center"});}
}
function pick(k){
  const q=Q[S.order[S.i]];if(S.done)return;
  if(q.t==="m"){S.sel=S.sel.includes(k)?S.sel.filter(x=>x!==k):[...S.sel,k];render();}
  else{S.sel=[k];check();}
}
function check(){
  const id=S.order[S.i],q=Q[id];
  const ok=S.sel.length===q.a.length&&q.a.every(x=>S.sel.includes(x));
  S.done=true;S.last=ok;S.scr=1;
  if(ok){S.score++;wrongSet.delete(id)}else{wrongSet.add(id);S.miss.push(id)}
  saveWrong();render();
}
function dunno(){
  const id=S.order[S.i];S.sel=[];S.done=true;S.last=false;S.dk=true;S.scr=1;
  wrongSet.add(id);S.miss.push(id);saveWrong();render();
}
function next(){S.dk=false;S.i++;S.sel=[];S.done=false;if(S.i>=S.order.length)result();else{render();window.scrollTo(0,0)}}
function result(){
  const n=S.order.length,p=Math.round(S.score/n*100);
  let h=`<div class="card" style="text-align:center"><div class="sub">結果</div><div class="big">${S.score} / ${n}</div><div>${p}% ${p>=80?"🎉 よくできました":p>=60?"あと少し！":"復習してもう一度"}</div></div>`;
  if(S.miss.length){h+=`<div class="card"><h2>間違えた問題</h2><ul class="list">`+S.miss.map(id=>`<li>${esc(Q[id].q)}<br><small style="color:var(--ok)">答：${Q[id].a.map(k=>esc(Q[id].o[k])).join("／")}</small></li>`).join("")+`</ul>
  <button class="btn primary" onclick='start(${JSON.stringify(S.miss)})'>間違えた問題だけもう一度</button></div>`;}
  if(S.les>=0){const L0=S.les;const all=Q.map((q,k)=>inLes(q,L0)?k:-1).filter(k=>k>=0);
    h+=`<button class="btn ghost" onclick="lesson(${L0})">📘 この単元の解説を読み直す</button><button class="btn ghost" onclick='start(${JSON.stringify(all)},0,${L0})'>この単元を全部解く (${all.length}問)</button>`;
    if(L0+1<LES.length)h+=`<button class="btn primary" style="background:#534AB7;border-color:#534AB7" onclick="lesson(${L0+1})">次の単元へ：${LES[L0+1].t} ›</button>`;}
  h+=`<button class="btn ghost" onclick="home()">ホームへ</button>`;
  app.innerHTML=h;window.scrollTo(0,0);
}

  ["P形","アクセプタ(3価)：In・B・Ga／多数キャリア＝ホール"],
  ["N形","ドナー(5価)：P・As・Sb／多数キャリア＝電子"],

  ["dB","電圧・電流は20log、電力は10log。log2＝0.301、log3＝0.477"],
  ["整流回路","半波は121%・40%、全波は48%・80%"],
  ["ハイブリッドIC","最適な組合せ・アナログ＋デジタル・高電圧大出力／集積度低い"],
  ["接地方式","ベース：高周波最良／エミッタ：一般増幅・反転／コレクタ：エミッタフォロワ"],

  ["温度","ICBOは10℃で約2倍、VBEは−2〜2.5mV/℃。安定度は電流帰還バイアスが最良"],
