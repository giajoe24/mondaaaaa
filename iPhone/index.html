<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機械製図 問題アプリ</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e3e0d8;
  --acc:#2f5d8a; --acc2:#e8eef5; --ok:#2e7d4f; --okbg:#e6f3eb; --ng:#b8402f; --ngbg:#f8e8e5;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161618;--card:#222226;--ink:#f1f1f3;--sub:#9a9aa2;--line:#34343a;
  --acc:#7fb0e0;--acc2:#24303c;--ok:#6cc391;--okbg:#1d3326;--ng:#e88b7c;--ngbg:#3a2320;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.02em}
.lead{color:var(--sub);font-size:13px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;
  font:inherit;color:inherit}
.mode:active{transform:scale(.99)}
.mode .ic{width:40px;height:40px;border-radius:10px;background:var(--acc2);color:var(--acc);
  display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.mode b{display:block;font-size:15px}
.mode small{color:var(--sub);font-size:12px}
.mode .best{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:none;background:none;color:var(--acc);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;color:var(--acc);background:var(--acc2);border-radius:6px;padding:1px 8px;margin-bottom:8px}
.q{font-size:16px;margin:0 0 14px}
.q .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--acc);margin:0 2px}
.sym{font-size:44px;text-align:center;font-weight:600;margin:4px 0 12px;font-family:"Times New Roman",serif}
.ch{display:block;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}
.ch:disabled{cursor:default;color:var(--ink)}
.ch.idk{text-align:center;font-size:14px;color:var(--sub);border-style:dashed;background:transparent;margin-top:4px}
.ch.idk.picked{border-color:var(--sub);border-style:solid;color:var(--ink)}
.fb.idk{background:var(--acc2);color:var(--acc)}
.tf{display:flex;gap:10px}
.tf .ch{text-align:center;font-size:24px;font-weight:700;padding:14px}
.fb{border-radius:12px;padding:12px 14px;margin-top:6px;font-size:14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.ng{background:var(--ngbg);color:var(--ng)}
.fb p{margin:4px 0 0;color:var(--ink)}
.next{width:100%;margin-top:12px;background:var(--acc);color:#fff;border:none;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ghost{background:var(--card);color:var(--acc);border:1.5px solid var(--acc)}
.score{text-align:center;padding:26px 16px}
.score .big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.score .of{color:var(--sub)}
.rv{font-size:14px;border-top:1px solid var(--line);padding:10px 0}
.rv:first-child{border-top:none}
.rv .a{color:var(--ok);font-weight:600}
.muted{color:var(--sub);font-size:12px}
.hidden{display:none}
.dgw{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.dg{display:block;width:100%;height:auto;color:var(--ink);font-family:inherit;background:var(--card)}
.dg text{font-size:13px;fill:currentColor}.dg text.sm{font-size:11.5px}.dg text.em{fill:var(--ng);font-size:12px}.dg text.ok{fill:var(--ok);font-size:12px}.dg text.b{font-weight:600}
.dg .lk{stroke:currentColor;stroke-width:2.2}.dg .ln{stroke:currentColor;stroke-width:.9}.dg .lc{stroke:currentColor;stroke-width:.9;stroke-dasharray:12 3 2 3}
.dg .lr{stroke:var(--ng);stroke-width:1.4}.dg .lf{stroke:currentColor;stroke-width:.6;stroke-dasharray:2 3;opacity:.5}.dg .ld{stroke:currentColor;stroke-width:.6;stroke-dasharray:3 2}.dg .emf{fill:var(--ng)}
.ref{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.refh{font-size:13px;color:var(--sub);margin-bottom:6px}
.zw{overflow-x:auto;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.zw img{display:block;width:100%;background:#fff}
.zw.big{cursor:zoom-out}
.zw.big img{width:200%;max-width:none}
.ask{width:100%;background:transparent;color:var(--acc);border:1.5px dashed var(--acc);border-radius:12px;padding:10px;font:inherit;font-size:14px;cursor:pointer;margin-top:2px}
.pg{font-size:11px;color:var(--sub);margin-left:4px}
.pgl{font-size:12px;color:var(--sub)!important;margin-top:6px!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// ===== 問題データ（機械製図法 p.330–342） =====
// MC: q内の「＿＿」が空欄。a=正解, d=誤答3つ, e=解説
const MC = [
 {s:"一般原則",q:"円弧の部分の寸法は、円弧が＿＿までは半径で表し、それを超える場合は直径で表す。",a:"180°",d:["90°","120°","270°"],e:"180°までは半径、超えたら直径。180°以内でも必要があれば直径を記入する。"},
 {s:"一般原則",q:"寸法は、なるべく＿＿に集中して記入する。",a:"主投影図",d:["側面図","断面図","補助投影図"],e:"主投影図に集中して記入する。"},
 {s:"一般原則",q:"図面に示す寸法は、特に明示しない限り、対象物の＿＿寸法を記入する。",a:"仕上がり",d:["素材","加工前","参考"],e:"特に明示しない限り仕上がり寸法。"},
 {s:"一般原則",q:"寸法は、なるべく＿＿して求める必要のないように記入する。",a:"計算",d:["測定","換算","作図"],e:"現場で計算しなくて済むように記入する。"},
 {s:"一般原則",q:"関連する寸法は、なるべく＿＿にまとめて記入する。",a:"1箇所",d:["複数の図","断面図","別表"],e:"関連する寸法は1箇所にまとめる。"},
 {s:"一般原則",q:"寸法は、＿＿を避ける。",a:"重複記入",d:["累進記入","並列記入","座標記入"],e:"同じ寸法を2回書かない。"},
 {s:"一般原則",q:"寸法は、＿＿ごとに配列を分けて記入する。",a:"工程",d:["部品","材料","図面"],e:"工程ごとに配列を分けて記入する。"},
 {s:"一般原則",q:"参考寸法は、寸法数値に＿＿をつけて示す。",a:"（ ）",d:["［ ］","＜ ＞","※"],e:"参考寸法は丸括弧。"},
 {s:"一般原則",q:"寸法の許容限界を指示するときに従うJIS規格は？　＿＿",a:"JIS Z 8318",d:["JIS B 0001","JIS B 0002","JIS Z 8114"],e:"機能上（互換性を含む）必要な場合、JIS Z 8318により許容限界を指示する。"},
 {s:"寸法補助線",q:"寸法補助線は、寸法線を＿＿まで延長する。",a:"わずかに越える",d:["ちょうど接する","大きく越える","2mm手前"],e:"寸法線をわずかに越えるまで延長する。"},
 {s:"寸法補助線",q:"特に必要な場合、寸法補助線は寸法線に対して適当な角度（＿＿がよい）をもつ平行線で引くことができる。",a:"60°",d:["30°","45°","75°"],e:"斜めに引くときは60°がよい。"},
 {s:"寸法補助線",q:"丸みや面取りがある2面の交わる位置は、丸み・面取り以前の形状を＿＿で表し、その交点から寸法補助線を引き出す。",a:"細い実線",d:["太い実線","細い破線","細い一点鎖線"],e:"細い実線で表し、交点から寸法補助線を引き出す。"},
 {s:"寸法線",q:"寸法線の端末記号は、矢印・黒丸・＿＿の3種類。",a:"斜線",d:["白丸","三角","十字"],e:"矢印・黒丸・斜線。1枚の図面で混用しない。"},
 {s:"寸法線",q:"角度を記入する寸法線は、2辺の交点を中心とした＿＿で表す。",a:"円弧",d:["直線","折れ線","破線"],e:"角度の寸法線は円弧。"},
 {s:"寸法線",q:"引出線を形状を表す線の内側から引き出す場合、引き出した箇所に＿＿をつける。",a:"黒丸",d:["矢印","斜線","何もつけない"],e:"外形線から→矢印、内側から→黒丸。"},
 {s:"寸法線",q:"狭い所で寸法線から斜めに引出線を出して数値を書く場合、引出線の引き出す側の端には＿＿。",a:"何もつけない",d:["矢印をつける","黒丸をつける","斜線をつける"],e:"寸法線から引き出す引出線の端には何もつけない。"},
 {s:"寸法数値",q:"長さの寸法数値は、通常＿＿の単位で記入し、単位記号はつけない。",a:"ミリメートル",d:["センチメートル","メートル","インチ"],e:"mm単位で、mmとは書かない。"},
 {s:"寸法数値",q:"角度をラジアンで記入する場合の書き方として正しいものは？",a:"0.52rad",d:["0.52","0.52°","0.52r"],e:"ラジアンは単位記号radを記入する。"},
 {s:"寸法数値",q:"寸法数値の書き方として正しいものは？",a:"22320",d:["22,320","22 320","22.320"],e:"けた数が多くてもコンマはつけない。"},
 {s:"寸法数値",q:"垂直方向の寸法線に対する寸法数値は、図面の＿＿から読めるように書く。",a:"右辺",d:["左辺","下辺","上辺"],e:"水平→下辺から、垂直→右辺から読めるように。"},
 {s:"寸法数値",q:"垂直線に対し左上から右下に向かい、約＿＿以下の角度をなす方向には寸法線の記入を避ける。",a:"30°",d:["15°","45°","60°"],e:"約30°以下の範囲は避ける。"},
 {s:"寸法数値",q:"JIS B 0001の2010年改訂で削除された、寸法数値の書き方は？",a:"図面の下方から読めるように書く方法2",d:["右辺から読む方法1","累進寸法記入法","座標寸法記入法"],e:"2000年版の方法2が2010年改訂で削除された。"},
 {s:"寸法補助記号",q:"半径の寸法線に矢印をつけるのは？",a:"円弧の側だけ",d:["中心の側だけ","両側","つけない"],e:"円弧側だけ。中心側にはつけない。"},
 {s:"寸法補助記号",q:"半径の寸法線を折り曲げる場合、矢印の付いた部分は＿＿に向いていなければならない。",a:"正しい中心位置",d:["図面の中央","水平方向","折り曲げた中心"],e:"折り曲げてもよいが、矢印部分は正しい中心へ。"},
 {s:"寸法補助記号",q:"円形の図に直径寸法を記入し、寸法線の両端に端末記号がつく場合、記号φは？",a:"省略する",d:["必ず記入する","Rに変える","括弧に入れる"],e:"両端に端末記号→φ省略。引出線で記入するときはφを書く。"},
 {s:"寸法補助記号",q:"正方形を正面から見て図に正方形が表れている場合の寸法の入れ方は？",a:"□をつけずに両辺の寸法を記入",d:["□10と1辺だけ記入","対角線の長さを記入","□と両辺を記入"],e:"正方形が見えている図では□は使わず両辺を記入。"},
 {s:"寸法補助記号",q:"45°面取り2mmの表し方として正しいものは？",a:"C2",d:["R2","2C","t2"],e:"C2 または 2×45°。"},
 {s:"寸法補助記号",q:"円弧の長さは、＿＿を寸法線とし、数値の前に⌒をつける。",a:"同心の円弧",d:["弦に平行な直線","弦に直角な直線","接線"],e:"円弧の長さ→同心円弧の寸法線＋⌒。弦の長さ→弦に平行な直線。"},
 {s:"寸法補助記号",q:"円弧で構成されない曲線の寸法は？",a:"曲線上の任意の点の座標寸法",d:["曲率半径","弦の長さ","円弧の長さ"],e:"円弧でない曲線は座標寸法で表す。"},
 {s:"穴・キー溝",q:"「13×20キリ」の意味は？",a:"直径20mmのきり穴が13個",d:["直径13mmのきり穴が20個","長さ13mm×幅20mmの穴","深さ20mmの穴が13個"],e:"総数×穴の寸法。"},
 {s:"穴・キー溝",q:"穴の深さを表す記号は？",a:"↧",d:["⌴","∨","t"],e:"↧＝穴深さ。⌴＝ざぐり、∨＝皿ざぐり。"},
 {s:"穴・キー溝",q:"深さを記入しない穴は？",a:"貫通穴",d:["きり穴","座ぐり穴","止まり穴"],e:"貫通穴は深さを記入しない。"},
 {s:"穴・キー溝",q:"穴の加工方法の区別を示すとき、まず示すのは？",a:"工具の呼び寸法または基準寸法",d:["加工方法の区別","穴の深さ","穴の個数"],e:"呼び寸法（基準寸法）→その後に加工方法（キリ・打抜き・鋳抜きなど）。"},
 {s:"穴・キー溝",q:"軸のキー溝の深さは、＿＿からキー溝の底までの寸法で表す。",a:"キー溝と反対側の軸径面",d:["軸の中心","キー溝側の軸径面","キーの上面"],e:"反対側の軸径面から測る。"},
 {s:"テーパ・こう配",q:"こう配を示す参照線は？",a:"水平に引く",d:["中心線に平行に引く","こう配と平行に引く","垂直に引く"],e:"テーパ→中心線に平行、こう配→水平。"},
 {s:"ねじ",q:"ねじの通常図示法で、山の頂を表す線は？",a:"太い実線",d:["細い実線","細い破線","細い一点鎖線"],e:"山の頂＝太い実線、谷底＝細い実線。"},
 {s:"ねじ",q:"ねじを端面から見た図で、谷底は細い実線の円周の約＿＿で表す。",a:"3/4",d:["1/2","2/3","全周"],e:"約3/4。できれば右上方に4分円をあける。"},
 {s:"ねじ",q:"端面から見たねじで4分円をあける位置は、できれば＿＿。",a:"右上",d:["左上","右下","左下"],e:"できれば右上方。"},
 {s:"ねじ",q:"隠れたねじの山の頂および谷底を表す線は？",a:"細い点線",d:["太い実線","細い実線","細い二点鎖線"],e:"隠れたねじの山の頂と谷底は、細い点線で表す（図8-91(c)）。"},
 {s:"ねじ",q:"不完全ねじ部を表す線は？",a:"傾斜した細い実線",d:["傾斜した太い実線","細い破線","細い一点鎖線"],e:"必要な場合は傾斜した細い実線。省略できれば表さない。"},
 {s:"ねじ",q:"ねじ部品の組立の図示で正しいのは？",a:"おねじ部品がめねじ部品を隠した状態で示す",d:["めねじ部品がおねじ部品を隠した状態で示す","両方を破線で示す","おねじは省略する"],e:"おねじが手前、めねじで隠さない。"},
 {s:"歯車",q:"歯車の基準円（ピッチ円）を表す線は？",a:"細い一点鎖線",d:["太い実線","細い実線","細い破線"],e:"歯先円＝太い実線、基準円＝細い一点鎖線、歯底円＝細い実線。"},
 {s:"歯車",q:"歯車を軸に直角な方向から断面で図示するとき、歯底の線は？",a:"太い実線",d:["細い実線","細い一点鎖線","省略する"],e:"断面図示では歯底も太い実線。"},
 {s:"歯車",q:"歯すじの方向を表すのは？",a:"3本の細い実線",d:["2本の細い実線","3本の太い実線","1本の細い一点鎖線"],e:"3本の細い実線。"},
 {s:"歯車",q:"側面図で歯底円を省略するのが原則なのは？",a:"かさ歯車・ウォームホイール",d:["平歯車・はすば歯車","ラック","内歯車"],e:"かさ歯車・ウォームホイールの側面図では省略が原則。"},
 {s:"ばね",q:"重ね板ばねの、力の作用がない状態を示す線は？",a:"二点鎖線",d:["一点鎖線","破線","太い実線"],e:"ばね板が直線状の状態で図示し、無負荷状態を二点鎖線で。"},
 {s:"ばね",q:"ばねの種類と形状だけを簡略図で表すとき、材料の中心線を描く線は？",a:"太い実線",d:["細い実線","細い一点鎖線","細い破線"],e:"中心線だけを太い実線で描く。"},
 {s:"ばね",q:"コイルばねで連続部分を一部省略する場合、断面中心位置を示す線は？",a:"細い一点鎖線",d:["細い実線","太い実線","二点鎖線"],e:"省略部分は断面中心位置を細い一点鎖線で。"},
 // ---- 追加：ペンを引いたのに問題がなかった箇所 ----
 {p:"330",pen:1,s:"一般原則",q:"寸法は、対象物の機能・製作・＿＿などを考えて、必要と思われる寸法を明瞭に図面に指示する。",a:"組立",d:["検査","材料","価格"],e:"機能・製作・組立などを考えて記入する。"},
 {p:"331",pen:1,s:"寸法補助線",q:"寸法は、通常は＿＿を用いて寸法線を記入し、この上に寸法数値を表示する。",a:"寸法補助線",d:["引出線","中心線","参照線"],e:"図が紛らわしくなるときは、寸法補助線によらなくてもよい。"},
 {p:"333",pen:1,s:"寸法数値",q:"角度の寸法数値は、一般に＿＿の単位で記入し、必要がある場合には分および秒を併用する。",a:"度",d:["ラジアン","分","グラード"],e:"度で記入し、必要なら分・秒を併用。"},
 {p:"335",pen:1,s:"寸法補助記号",q:"球の直径または半径の寸法は、寸法数値の前に球の記号＿＿を記入して表す。",a:"Sφ または SR",d:["φ または R","□ または C","CR または t"],e:"球の直径＝Sφ、球の半径＝SR。"},
 {p:"335",pen:1,s:"寸法補助記号",q:"板の厚さは、厚さの寸法数値の前に、同じ大きさで記号＿＿を記入する。",a:"t",d:["T","C","□"],e:"厚さの記号は小文字の t。"},

// 問題ID → 図
const QDIA={m1:"main",m3:"calc",m4:"onepl",m5:"dup",m7:"ref",m11:"fillet",m16:"units",m19:"read",m23:"rbend",m24:"phi",m25:"square",m26:"chamfer",m27:"arc",
 m29:"holes",m30:"holes",m32:"holes",m35:"thread",m36:"thread",m37:"thread",m39:"incomplete",m40:"assembly",m41:"gear",m42:"gearsec",
 m49:"ext",m50:"units",m51:"sphere",m52:"thick",m53:"arc",m54:"curve",m55:"key",m56:"hkey",t6:"phi",t14:"incomplete",
 s0:"phi",r0:"phi",s1:"sphere",r1:"sphere",s2:"square",r2:"square",s3:"R",r3:"R",s5:"sphere",r5:"sphere",s6:"arc",r6:"arc",
 s7:"chamfer",r7:"chamfer",s8:"thick",r8:"thick",s9:"holes",r9:"holes",s11:"holes",r11:"holes"};

return {DIA,QDIA};
})();
// ===== ロジック =====
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = (arr,n,ex) => shuffle(arr.filter(x=>x!==ex)).slice(0,n);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

const refOf=q=>(REF[q.id]||(/^[sr]/.test(q.id)?"E334_tab":"")).split(",").filter(Boolean);
function buildPool(){
  const p=[];
  MC.forEach((x,i)=>p.push({id:"m"+i,type:"mc",pen:x.pen?true:PEN_M.has(i),pg:x.p||MP[i],sec:x.s,q:x.q,a:x.a,ch:shuffle([x.a,...x.d]),e:x.e}));
  TF.forEach((x,i)=>p.push({id:"t"+i,type:"tf",pen:x.pen?true:PEN_T.has(i),pg:x.p||TP[i],sec:x.s,q:x.q,a:x.a?"○":"×",ch:["○","×"],e:x.e}));
  SYM.forEach((x,i)=>{
    p.push({id:"s"+i,type:"sym",pen:!SYM_NOPEN.has(i),pg:"334（表8-2）",sec:"記号",sym:x[1],q:"この寸法補助記号の意味は？",a:x[0],ch:shuffle([x[0],...pick(SYM.map(s=>s[0]),3,x[0])]),e:`${x[1]}＝${x[0]}（読み：${x[2]}）`});
    p.push({id:"r"+i,type:"mc",pen:!SYM_NOPEN.has(i),pg:"334（表8-2）",sec:"記号",q:`「${x[0]}」を表す寸法補助記号は？`,a:x[1],ch:shuffle([x[1],...pick(SYM.map(s=>s[1]),3,x[1])]),e:`読み方：${x[2]}`});
  });
  return p;
}
const POOL = buildPool();
const MODES = [
  {k:"all",ic:"全",t:"全部まぜて",d:"すべての問題からランダム",f:()=>true},
  {k:"pen",ic:"✏️",t:"ペンのとこだけ",d:"赤線を引いたところから",f:q=>q.pen},
  {k:"mc",ic:"4",t:"4択問題",d:"寸法・ねじ・歯車・ばね",f:q=>q.type==="mc"&&!q.id.startsWith("r")},
  {k:"tf",ic:"○×",t:"○×問題",d:"ひっかけに注意",f:q=>q.type==="tf"},
  {k:"sym",ic:"φ",t:"寸法補助記号",d:"表8-2 の記号と意味",f:q=>q.sec==="記号"},
  {k:"miss",ic:"✕",t:"間違えた問題だけ",d:"",f:q=>store.get("miss",[]).includes(q.id)},
];
let N = store.get("n",10);
let S = null;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function home(){
  const miss = store.get("miss",[]);
  const best = store.get("best",{});
  app.innerHTML = `
   <h1>機械製図 問題アプリ</h1>
   <p class="lead">寸法記入方法・ねじ・歯車・ばね（p.330–342）／全${POOL.length}問</p>
   <div class="muted">1回の問題数</div>
   <div class="opts">${[10,20,30,0].map(n=>`<button class="chip ${N===n?"on":""}" data-n="${n}">${n||"全部"}</button>`).join("")}</div>
   ${MODES.map(m=>{
     const cnt = POOL.filter(m.f).length;
     if(m.k==="miss"&&!cnt) return "";
     const b = best[m.k]!=null?`ベスト ${best[m.k]}%`:"";
     return `<button class="mode" data-m="${m.k}"><span class="ic">${m.ic}</span>
       <span><b>${m.t}</b><small>${m.k==="miss"?cnt+"問あります":m.d+"・"+cnt+"問"}</small></span>
       <span class="best">${b}</span></button>`}).join("")}
  `;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{N=+b.dataset.n;store.set("n",N);home()});
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
}

function start(k){
  const m = MODES.find(x=>x.k===k);
  let qs = shuffle(POOL.filter(m.f));
  if(N && k!=="miss") qs = qs.slice(0,N);
  S = {k,qs,i:0,ok:0,log:[]};
  show();
}

function show(){
  const q = S.qs[S.i];
  const pct = S.i/S.qs.length*100;
  const qtext = esc(q.q).replace(/＿＿/g,'<span class="blank">&nbsp;</span>');
  app.innerHTML = `
   <div class="top"><button class="back" id="bk">‹ やめる</button>
     <div class="prog"><i style="width:${pct}%"></i></div>
     <span class="cnt">${S.i+1}/${S.qs.length}</span></div>
   <div class="card">
     <span class="tag">${esc(q.sec)}${q.type==="tf"?"・○×":""}</span> <span class="pg">📖 p.${esc(q.pg)}${q.pen?"　✏️ペン":""}</span>
     ${q.type==="sym"?`<div class="sym">${esc(q.sym)}</div>`:""}
     <p class="q">${qtext}</p>
     <div class="${q.type==="tf"?"tf":""}" id="chs">
       ${q.ch.map((c,j)=>`<button class="ch" data-j="${j}">${esc(c)}</button>`).join("")}
     </div>
     <button class="ch idk" data-j="-1">🤔 わからない</button>
     <div id="fb"></div>
   </div>`;
  document.getElementById("bk").onclick=home;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(b));
}

function answer(btn){
  const q = S.qs[S.i];
  const idk = btn.dataset.j==="-1";
  const v = idk ? "わからない" : q.ch[+btn.dataset.j];
  const right = !idk && v===q.a;
  app.querySelectorAll(".ch").forEach(b=>{
    b.disabled=true;
    if(b.dataset.j==="-1"){ if(idk) b.classList.add("picked"); return; }
    const c=q.ch[+b.dataset.j];
    if(c===q.a) b.classList.add("ok"); else if(b===btn) b.classList.add("ng");
  });
  if(idk) S.idk=(S.idk||0)+1;
  let miss = store.get("miss",[]);
  if(right){S.ok++; miss=miss.filter(x=>x!==q.id);} else if(!miss.includes(q.id)) miss.push(q.id);
  store.set("miss",miss);
  S.log.push({q,v,right});
  const last = S.i===S.qs.length-1;
  document.getElementById("fb").innerHTML = `
    <div class="fb ${right?"ok":idk?"idk":"ng"}"><b>${right?"正解！":idk?"正解は「"+esc(q.a)+"」。覚えておこう！":"ざんねん… 正解は「"+esc(q.a)+"」"}</b>
    ${q.e?`<p>${esc(q.e)}</p>`:""}</div>
    <button class="next" id="nx">${last?"結果を見る":"次へ"}</button>
    ${QDIA[q.id]?`<div class="dgw"><div class="refh">✏️ 図で見る</div>${DIA[QDIA[q.id]]}</div>`:""}
    <div class="ref"><div class="refh">📖 教科書 p.${esc(q.pg)}</div><div class="muted" style="margin:-2px 0 6px">画像をタップで拡大</div>${refOf(q).map(k=>`<div class="zw"><img src="img/${k}.jpg" alt="教科書 p.${esc(q.pg)} の該当部分" loading="lazy"></div>`).join("")}
    <button class="ask" id="ask">💬 Claudeに聞く（コピーしてチャットに貼る）</button><div id="askmsg" class="muted"></div></div>`;
  document.querySelectorAll(".zw").forEach(z=>z.onclick=()=>z.classList.toggle("big"));
  document.getElementById("ask").onclick=()=>{
    const t=`機械製図アプリの問題でわからないところ\n問題：${q.sym?q.sym+" ":""}${q.q.replace(/＿＿/g,"（　）")}\n選択肢：${q.ch.join(" / ")}\n正解：${q.a}\n自分の答え：${v}\n教科書：p.${q.pg}\n`;
    const m=document.getElementById("askmsg");
    const fallback=()=>{m.innerHTML='コピーできなかったので、下を長押ししてコピーしてください：<textarea readonly style="width:100%;height:110px;margin-top:6px">'+esc(t)+'</textarea>';};
    try{navigator.clipboard.writeText(t).then(()=>{m.textContent="コピーしました。チャットに貼って、聞きたいことを足して送ってください。"},fallback)}catch(e){fallback()}
  };
  document.getElementById("nx").onclick=()=>{ if(last) result(); else {S.i++;show();} };
  document.getElementById("nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function result(){
  const n=S.qs.length, p=Math.round(S.ok/n*100);
  const best=store.get("best",{});
  if(S.k!=="miss" && (best[S.k]==null||p>best[S.k])){best[S.k]=p;store.set("best",best);}
  const wrong=S.log.filter(x=>!x.right);
  const msg = p===100?"完璧！":p>=80?"いい感じ！":p>=60?"もう一息！":"復習しよう";
  app.innerHTML = `
   <div class="card score"><div class="muted">${msg}</div>
     <div class="big">${S.ok}<span class="of" style="font-size:22px"> / ${n}</span></div>
     <div class="muted">正答率 ${p}%${S.idk?`（わからない ${S.idk}問）`:""}</div></div>
   ${wrong.length?`<button class="next" id="rw">間違えた${wrong.length}問をもう一回</button>`:""}
   <button class="next ghost" id="hm">メニューへ</button>
   ${wrong.length?`<div class="card" style="margin-top:14px"><b style="font-size:14px">見直し</b>
     ${wrong.map(x=>`<div class="rv">${x.q.sym?`<b>${esc(x.q.sym)}</b> `:""}${esc(x.q.q).replace(/＿＿/g,"（　）")}
       <div>あなた：${esc(x.v)}　<span class="a">正解：${esc(x.q.a)}</span>　<span class="muted">p.${esc(x.q.pg)}</span></div></div>`).join("")}</div>`:""}`;
  document.getElementById("hm").onclick=home;
  const rw=document.getElementById("rw");
  if(rw) rw.onclick=()=>{S={k:"retry",qs:shuffle(wrong.map(x=>({...x.q,ch:x.q.type==="tf"?x.q.ch:shuffle(x.q.ch)}))),i:0,ok:0,log:[]};show();};
  window.scrollTo(0,0);
}
home();
</script>
