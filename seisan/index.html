<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生産工学 暗記アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 試験前夜の単語帳。速く、迷わず、片手で。
   IDEA: 工程の検査票（データシート）— 合格/不合格を付けていく
   PICTURE: 画面いっぱいの大きなカード自体
   COLOUR and TYPE: コバルト帯・白・黒、正解グリーン/不正解レッドのみ。Noto Sans JP + Space Grotesk の数字
   LAYOUT: 上に細いタブ帯、中央に1枚のカード、下に親指で押す大きなボタン */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fd,#0a0d18);--card:light-dark(#fff,#141a2e);--ink:light-dark(#0b1020,#e8ecff);--mut:light-dark(#5a6380,#9aa3c4);--co:#1240e0;--co2:light-dark(#eef2ff,#1b2550);--ok:#0f9d58;--ng:#d93025;--line:light-dark(#d8def0,#2a3358)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
header{background:var(--co);color:#fff;padding:12px max(4vw,14px) 0;position:sticky;top:0;z-index:5}
h1{margin:0 0 8px;font-size:18px;font-weight:900;letter-spacing:.02em}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1 0 auto;background:none;border:0;color:#c9d4ff;font:700 15px "Noto Sans JP";padding:10px 12px 12px;border-bottom:3px solid transparent;min-height:44px;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:#fff}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 40px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar select,.bar button{font:15px "Noto Sans JP";min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px}
.prog{flex:1 1 120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.num{font:700 14px "Space Grotesk",sans-serif;color:var(--mut);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:46vh;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;box-shadow:0 6px 24px rgba(18,64,224,.08);position:relative}
.tag{position:absolute;top:12px;left:16px;font-size:12px;font-weight:700;color:var(--co);background:var(--co2);padding:2px 10px;border-radius:20px}
:root[data-theme=dark] .tag{color:#aab9ff}
.q{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.5;text-wrap:balance}
.a{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line);font-size:clamp(18px,4.6vw,22px);font-weight:700;color:var(--co);white-space:pre-line}
:root[data-theme=dark] .a{color:#8fa6ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .a{color:#8fa6ff}:root:not([data-theme=light]) .tag{color:#aab9ff}}
.hint{margin-top:auto;padding-top:18px;font-size:13px;color:var(--mut);text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{min-height:56px;border:0;border-radius:14px;font:900 17px "Noto Sans JP";color:#fff;cursor:pointer}
.btn.ng{background:var(--ng)}.btn.ok{background:var(--ok)}.btn.co{background:var(--co)}.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,nav button:focus-visible,.opt:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 16px/1.45 "Noto Sans JP";cursor:pointer;white-space:pre-line}
.opt.r{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.opt.w{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--co2);font-size:15px;white-space:pre-line}
.done{text-align:center;padding:30px 10px}.done b{font:700 56px "Space Grotesk";color:var(--co);display:block}
.sheet section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sheet h2{font-size:17px;margin:0 0 8px;color:var(--co)}
:root[data-theme=dark] .sheet h2{color:#8fa6ff}
.sheet .f{font:700 17px "Noto Sans JP";padding:6px 10px;background:var(--co2);border-radius:8px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.sheet p{margin:4px 0;font-size:15px}
.small{font-size:13px;color:var(--mut)}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.step.todo{color:var(--mut);font-size:15px}.step.cur{border:2px solid var(--co)}.step.sok{border-left:6px solid var(--ok)}.step.sng{border-left:6px solid var(--ng)}
.sl{font-weight:700;font-size:16px}.sl b{font-size:18px}.sok .sl b{color:var(--ok)}.sng .sl b{color:var(--ng)}
.sa{font-weight:900;font-size:18px;margin-top:4px}.sh{white-space:pre-line;font-size:15px;color:var(--mut);margin-top:4px}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;min-height:52px;font:700 20px "Space Grotesk","Noto Sans JP",sans-serif;border-radius:12px;border:2px solid var(--line);padding:0 12px;background:var(--bg);color:var(--ink)}
.row .btn{flex:none;padding:0 16px;min-height:52px;font-size:16px}
.lk{background:none;border:0;color:var(--mut);text-decoration:underline;font:14px "Noto Sans JP";min-height:44px;padding:0;cursor:pointer}
.scroll{overflow-x:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--co2);border-radius:12px;padding:4px;margin-bottom:12px}.seg button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--ink);font:700 15px "Noto Sans JP";cursor:pointer}.seg button.on{background:var(--co);color:#fff}
.qc{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.qc svg{flex:none;width:110px;height:74px;color:var(--ink)}.qc b{font-size:16px}.qc p{margin:2px 0 0;font-size:14px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>生産工学 期末 暗記アプリ</h1>
<nav id="tabs"><button data-t="go" class="on">語句</button><button data-t="ko">公式</button><button data-t="calc">計算練習</button><button data-t="sheet">まとめ</button></nav></header>
<main id="app"></main>
<script>
{

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));cat="すべて";qz=null;newDeck();render()});
app.addEventListener("change",e=>{if(e.target.id==="cgen"){cgen=+e.target.value;cq=null;render();return}if(e.target.id==="cat"){cat=e.target.value;newDeck();qz=null;render()}});
app.addEventListener("click",e=>{const t=e.target.closest("button,.card");if(!t)return;const id=t.id;if(t.dataset.s){sub=t.dataset.s;qz=null;newDeck();render();return}const mode=(tab==="go"||tab==="ko")?sub:tab;
 if(mode==="card"){if(id==="flip"||id==="show"){if(!open){open=true;render()}}else if(id==="yes")mark(1);else if(id==="no")mark(0);else if(id==="skip"){pos++;render()}else if(id==="ng"){onlyNG=!onlyNG;newDeck();render()}else if(id==="again"){newDeck();render()}else if(id==="reset"){st={};save();newDeck();render()}}
 else if(mode==="quiz"){if(t.classList.contains("opt")&&qz.pick===null){const k=+t.dataset.k,i=qz.list[qz.i];qz.pick=k;if(k===2){qz.ok++;delete qmiss[i]}else qmiss[i]=1;qsave();render()}else if(id==="qnext"){qz.i++;qz.pick=null;qz.opts=null;render()}else if(id==="qnew"){newQuiz();render()}else if(id==="qretry"||id==="qmiss"){qOnlyMiss=id==="qretry"?true:!qOnlyMiss;newQuiz();render()}}
 else if(tab==="calc"){if(id==="chk")check(false);else if(id==="idk")check(true);else if(id==="snext"){cq.i++;cq.shown=false;const y=window.scrollY;drawCalc();window.scrollTo(0,y);const el=document.getElementById("ans");if(el)el.focus()}else if(id==="cnext"){cq=null;render()}}
});
document.addEventListener("keydown",e=>{if(!((tab==="go"||tab==="ko")&&sub==="card"))return;if(e.key===" "){e.preventDefault();if(!open){open=true;render()}}else if(open&&e.key==="ArrowRight")mark(1);else if(open&&e.key==="ArrowLeft")mark(0)});
newDeck();render();
}
</script>
