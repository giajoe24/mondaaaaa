:root{color-scheme:light dark;--bg:light-dark(#f4f6fd,#0a0d18);--card:light-dark(#fff,#141a2e);--ink:light-dark(#0b1020,#e8ecff);--mut:light-dark(#5a6380,#9aa3c4);--co:#1240e0;--co2:light-dark(#eef2ff,#1b2550);--ok:#0f9d58;--ng:#d93025;--line:light-dark(#d8def0,#2a3358)}

*{box-sizing:border-box;min-width:0}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.num{font:700 14px "Space Grotesk",sans-serif;color:var(--mut);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:46vh;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;box-shadow:0 6px 24px rgba(18,64,224,.08);position:relative}
.tag{position:absolute;top:12px;left:16px;font-size:12px;font-weight:700;color:var(--co);background:var(--co2);padding:2px 10px;border-radius:20px}

.q{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.5;text-wrap:balance}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{min-height:56px;border:0;border-radius:14px;font:900 17px "Noto Sans JP";color:#fff;cursor:pointer}

.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 16px/1.45 "Noto Sans JP";cursor:pointer;white-space:pre-line}
.opt.r{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.opt.w{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--co2);font-size:15px;white-space:pre-line}
.done{text-align:center;padding:30px 10px}.done b{font:700 56px "Space Grotesk";color:var(--co);display:block}
.sheet section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sheet h2{font-size:17px;margin:0 0 8px;color:var(--co)}
:root[data-theme=dark] .sheet h2{color:#8fa6ff}
.sheet .f{font:700 17px "Noto Sans JP";padding:6px 10px;background:var(--co2);border-radius:8px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.sheet p{margin:4px 0;font-size:15px}
.small{font-size:13px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 return lo?{t:"片側規格",q:`溶接強度は下限 ${L}N のみ。平均 ${mu}N、標準偏差 ${s}N のとき Cp は？`,a:`下限のみ → Cp ＝（平均 − 下限）÷（標準偏差 × 3）\n＝ (${mu} − ${L}) ÷ (3 × ${s}) ≒ ${f2(cp)}`}:{t:"片側規格",q:`振れは上限 ${U} のみ。平均 ${L}、標準偏差 ${s} のとき Cp は？`,a:`上限のみ → Cp ＝（上限 − 平均）÷（標準偏差 × 3）\n＝ (${U} − ${L}) ÷ (3 × ${s}) ≒ ${f2(cp)}`}}
];

function drawSheet(){app.innerHTML=`<div class="sheet">
<section><h2>中心的傾向</h2><div class="f">平均 ＝ データの合計 ÷ データの個数</div><p>中央値：並べて真ん中（偶数個は真ん中2つの平均）</p><p>最頻値：一番多く出る値</p><div class="f">中点値 ＝ (最大 ＋ 最小) ÷ 2</div></section>
<section><h2>ばらつき</h2><div class="f">範囲 ＝ 最大 − 最小</div><div class="f">平方和 ＝（平均との差）を2乗して全部足す</div><p>覚える式：（データを2乗して全部足す）−（合計の2乗 ÷ 個数）</p><div class="f">不偏分散 ＝ 平方和 ÷（個数 − 1）</div><p>「個数 − 1」を自由度という</p><div class="f">標準偏差 ＝ 分散のルート</div><p>記号：母集団の平均はμ（ミュー）、標準偏差はσ（シグマ）。サンプルの平均はx̄（エックスバー）、標準偏差はs</p></section>
<section><h2>正規分布</h2><p>平均から ±標準偏差1個分：68.3%、2個分：95.4%、3個分：99.7%</p><div class="f">Z ＝（測定値 − 平均）÷ 標準偏差</div><p>N(3, 16) のような書き方は N(平均, <b>分散</b>)。標準偏差は分散のルート。</p><p>表は「Zより右側の確率」。区間は 右側 − 右側 で引く。平均をまたぐときは 1 − 左 − 右。</p></section>
<section><h2>工程能力</h2><div class="f">Cp ＝（上限 − 下限）÷（標準偏差 × 6）</div><p>Cpk：（上限 − 平均）÷（標準偏差 × 3）と（平均 − 下限）÷（標準偏差 × 3）を出して、小さい方</p><p>片側規格の Cp：上限だけなら（上限 − 平均）÷（標準偏差 × 3）、下限だけなら（平均 − 下限）÷（標準偏差 × 3）</p><p>1.33以上で満足、1.67超は良すぎ（1.33〜1.67が経済的）、1未満は不良が出る。</p><p>Cpk改善：平均を中心へ寄せる／ばらつきを減らす</p></section>
<section><h2>言葉</h2><p>マーケットイン ⇔ プロダクトアウト</p><p>計数値（数える）／計量値（測る）</p><p>因子・水準・主効果・交互作用（フィッシャー）</p><p>ねらいの品質＝設計品質／出来栄えの品質＝製造品質</p><p>当たり前品質／魅力的品質</p><p>七つ道具：パレート図・特性要因図・チェックシート・ヒストグラム・散布図・グラフ（管理図）・層別</p><p>重点管理：S保安・E排気・R法規制・F走行・C重要</p></section></div>`}
